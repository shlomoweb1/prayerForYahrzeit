<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/favico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favico/favicon-16x16.png">
    <link rel="manifest" href="/icons/favico/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="בניית דף תפילה מהודר להדפסה — תהילים, קדיש, משניות והשכבה — לקריאה בבית העלמין ולשיתוף עם המשפחה"
    />
    <meta name="theme-color" content="#141a2e" />
    <title>תפילה לנשמה — דף תפילה לקריאה בבית העלמין</title>
    <script>
      ;(function () {
        var KEY = 'izkor:theme:v1'
        var THEMES = ['dusk', 'parchment', 'stone']
        var MODES = ['light', 'dark']
        var state = { theme: 'dusk', mode: 'dark' }
        try {
          var stored = JSON.parse(window.localStorage.getItem(KEY) || 'null')
          if (stored && typeof stored === 'object') {
            if (THEMES.indexOf(stored.theme) !== -1) state.theme = stored.theme
            if (MODES.indexOf(stored.mode) !== -1) state.mode = stored.mode
          }
        } catch (e) {
          state = { theme: 'dusk', mode: 'dark' }
        }
        var root = document.documentElement
        root.dataset.theme = state.theme
        root.dataset.themeMode = state.mode
        root.style.colorScheme = state.mode
      })()
    </script>
    <script>
      ;(function () {
        var LOCALE_KEY = 'izkor:locale:v1'
        var LOCALES = ['he', 'en', 'es', 'fr']
        var locale = 'he'
        try {
          var storedLocale = window.localStorage.getItem(LOCALE_KEY)
          if (LOCALES.indexOf(storedLocale) !== -1) locale = storedLocale
        } catch (e) {
          locale = 'he'
        }
        var root = document.documentElement
        root.lang = locale
        root.dir = locale === 'he' ? 'rtl' : 'ltr'
        var KEY = 'izkor:a11y:v1'
        var classes = []
        var stored = null
        try {
          stored = JSON.parse(window.localStorage.getItem(KEY) || 'null')
        } catch (e) {
          stored = null
        }
        if (stored && typeof stored === 'object') {
          if (stored.contrast) classes.push('a11y-contrast')
          if (stored.mono) classes.push('a11y-mono')
          if (stored.textSize === 125 || stored.textSize === 150) {
            classes.push('a11y-text-' + stored.textSize)
          }
          if (stored.lineSpacing) classes.push('a11y-line-spacing')
          if (stored.wordSpacing) classes.push('a11y-word-spacing')
          if (stored.letterSpacing) classes.push('a11y-letter-spacing')
          if (stored.readableFont) classes.push('a11y-readable-font')
          if (stored.highlightLinks) classes.push('a11y-highlight-links')
          if (stored.highlightHeadings) classes.push('a11y-highlight-headings')
          if (stored.largeCursor) classes.push('a11y-large-cursor')
          if (stored.stopAnimations) classes.push('a11y-stop-animations')
        }
        if (classes.length > 0) {
          document.documentElement.classList.add.apply(
            document.documentElement.classList,
            classes,
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
