<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/favico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favico/favicon-16x16.png">
    <link rel="manifest" href="/icons/favico/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141a2e" />
    <!-- title/description/OG are managed per route via TanStack Router's head() -->
    <!-- Deliberately synchronous (no async/defer): these must run and paint
         document.documentElement's theme/dir/lang/a11y state before first
         paint, or the page flashes the wrong theme/RTL direction/locale for
         a frame. The version query strings are appended by
         vite-plugins/head-scripts-version.ts. -->
    <script src="/scripts/theme-init.js"></script>
    <script src="/scripts/locale-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
